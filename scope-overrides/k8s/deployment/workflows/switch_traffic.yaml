# Override for the "containers" scope on the poc-tests EKS cluster.
#
# The stock k8s scope renders an ALB Ingress and verifies it through route53's
# reconciliation step. This cluster routes through the Istio gateway that
# infrastructure/aws provisions, holding a cert-manager wildcard rather than an
# ACM certificate, so the ALB controller rejects the Ingress with "no
# certificate found for host" and the deployment dies in
# verify_networking_reconciliation -- before it ever waits on the pod.
#
# Only `configuration` is overridden; every step comes from the base workflow.
# INGRESS_TEMPLATE is restated rather than left to resolve from
# BLUE_GREEN_INGRESS_PATH, because the base workflow binds it in its own
# configuration block and the merge order between the two is not documented.
#
# $SERVICE_PATH still points at the k8s/ directory of the scopes clone, so these
# templates are the ones that repo already ships. Nothing is forked.
configuration:
  # Selects verify_http_route_reconciliation (HTTPRoute) over
  # verify_ingress_reconciliation (ALB Ingress).
  DNS_TYPE: external_dns

  SERVICE_TEMPLATE:        "$SERVICE_PATH/deployment/templates/istio/service.yaml.tpl"
  INITIAL_INGRESS_PATH:    "$SERVICE_PATH/deployment/templates/istio/initial-httproute.yaml.tpl"
  BLUE_GREEN_INGRESS_PATH: "$SERVICE_PATH/deployment/templates/istio/blue-green-httproute.yaml.tpl"
  INGRESS_TEMPLATE:        "$BLUE_GREEN_INGRESS_PATH"
