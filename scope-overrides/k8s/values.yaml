# Overrides for the "containers" scope (nullplatform/scopes, path k8s) on the
# poc-tests EKS cluster.
#
# The stock k8s/values.yaml assumes the AWS Load Balancer Controller: DNS_TYPE
# route53, and ingress templates that render an ALB Ingress. This cluster does
# not route that way -- it terminates TLS at an Istio gateway with a wildcard
# certificate issued by cert-manager into the `gateways` namespace. An ALB
# Ingress there never reconciles, because the ALB controller looks for a
# matching certificate in ACM and this setup deliberately creates none. The
# deployment then fails in `verify_networking_reconciliation`, before it ever
# gets to wait for the pod.
#
# $SERVICE_PATH still resolves to the k8s/ directory of the scopes clone, so
# these templates are the ones that repo already ships -- nothing is forked.
configuration:
  # Selects verify_http_route_reconciliation (HTTPRoute) over
  # verify_ingress_reconciliation (ALB Ingress).
  DNS_TYPE: external_dns

  SERVICE_TEMPLATE:        "$SERVICE_PATH/deployment/templates/istio/service.yaml.tpl"
  INITIAL_INGRESS_PATH:    "$SERVICE_PATH/deployment/templates/istio/initial-httproute.yaml.tpl"
  BLUE_GREEN_INGRESS_PATH: "$SERVICE_PATH/deployment/templates/istio/blue-green-httproute.yaml.tpl"
